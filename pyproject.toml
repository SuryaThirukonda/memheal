[project]
name = "memheal"
version = "0.1.0"
description = "Memory-poisoning evolution, diagnosis, and recovery for agentic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mem0ai>=2.2.1",
    "numpy>=1.26",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pypdf>=6.21.1",
    "pytest>=8.0",
    "reportlab>=5.0.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
# Errors only (syntax errors, undefined names, unused imports/variables): the code has
# its own style, so formatting rules would only churn it.
select = ["E9", "F"]
