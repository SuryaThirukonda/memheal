[project]
name = "memheal"
version = "0.1.0"
description = "Memory-poisoning evolution, diagnosis, and recovery for agentic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
